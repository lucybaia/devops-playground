apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devstation
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lucybaia/devops-playground.git
    targetRevision: main
    path: k8s/base
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true