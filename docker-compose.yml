services:
  api:
    build:
      context: ./apps/api
    container_name: devstation-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://devstation:changeme@db:5432/devstation
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: devstation-db
    environment:
      - POSTGRES_USER=devstation
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_DB=devstation
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devstation"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: